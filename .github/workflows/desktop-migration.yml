name: Desktop migration checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# Keep only the newest validation run for this PR/branch.
concurrency:
  group: desktop-migration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux Tauri prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl wget file \
            libssl-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libwebkit2gtk-4.1-dev libxdo-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Regenerate Cargo lockfile
        if: runner.os == 'Linux'
        run: cargo generate-lockfile

      - name: Upload regenerated Cargo lockfile
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: regenerated-cargo-lockfile
          path: Cargo.lock
          if-no-files-found: error

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install desktop host dependencies
        working-directory: crates/reef-app
        run: pnpm install --no-frozen-lockfile

      - name: Install frontend dependencies
        working-directory: crates/reef-app/frontend
        run: pnpm install --no-frozen-lockfile

      - name: Check frontend types
        working-directory: crates/reef-app/frontend
        run: pnpm check

      - name: Build frontend
        working-directory: crates/reef-app/frontend
        run: pnpm build

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Check Rust workspace
        run: cargo check --workspace --all-targets

      - name: Run Rust tests
        run: cargo test --workspace

      - name: Generate platform icon assets
        working-directory: crates/reef-app
        run: pnpm exec tauri icon icons/icon.png

      - name: Build Tauri desktop binary
        working-directory: crates/reef-app
        run: pnpm exec tauri build --no-bundle
