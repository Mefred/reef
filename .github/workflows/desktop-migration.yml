name: Desktop migration checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# Keep only the newest validation run for this PR/branch.
concurrency:
  group: desktop-migration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Check Rust workspace
        run: cargo check --workspace --all-targets --locked

      - name: Run Rust tests
        run: cargo test --workspace --locked

      - name: Add Windows x64 target
        if: runner.os == 'Linux'
        run: rustup target add x86_64-pc-windows-gnu

      - name: Install MinGW for Windows cross-build
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64

      - name: Build Windows x64 portable binary
        if: runner.os == 'Linux'
        env:
          # Enable legacy SHA1-based key-exchange algorithms in libssh2
          # (diffie-hellman-group14-sha1, diffie-hellman-group-exchange-sha1)
          # required by many Cisco IOS devices.
          CFLAGS_X86_64_PC_WINDOWS_GNU: "-DLIBSSH2_KEX_SHA1_ENABLE"
        run: cargo build --release --target x86_64-pc-windows-gnu -p reef-app

  windows:
    name: Build Windows x64 (native)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Build Windows x64 portable binary
        run: cargo build --release --target x86_64-pc-windows-gnu -p reef-app
        env:
          # Enable legacy SHA1-based key-exchange algorithms in libssh2
          # (diffie-hellman-group14-sha1, diffie-hellman-group-exchange-sha1)
          # required by many Cisco IOS devices.
          CFLAGS_X86_64_PC_WINDOWS_GNU: "-DLIBSSH2_KEX_SHA1_ENABLE"
