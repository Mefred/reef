[package]
name = "reef-session"
description = "Device session and transport management for Reef (SSH/Telnet/Serial)"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"

[dependencies]
reef-engine = { path = "../reef-engine" }
reef-logging = { path = "../reef-logging" }
tokio = { version = "1", features = ["full"] }
tokio-serial = "5"
ssh2 = "0.9"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
directories = "5"
lazy_static = "1"
regex = "1"
hex = "0.4"
tracing = "0.1"

[dev-dependencies]
tokio-test = "0.3"
futures = "0.3"
