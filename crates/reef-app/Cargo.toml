[package]
name = "reef-app"
description = "Reef desktop GUI application (Slint)"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"

[dependencies]
reef-engine = { path = "../reef-engine" }
reef-session = { path = "../reef-session" }
reef-storage = { path = "../reef-storage" }
reef-logging = { path = "../reef-logging" }
slint = "1.8"
tracing = "0.1"

[build-dependencies]
slint-build = "1.8"

[[bin]]
name = "reef"
path = "src/main.rs"
