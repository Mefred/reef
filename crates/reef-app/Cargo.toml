[package]
name = "reef-app"
description = "Reef network device management desktop application"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"

[dependencies]
reef-engine = { path = "../reef-engine" }
reef-session = { path = "../reef-session" }
reef-storage = { path = "../reef-storage" }
reef-logging = { path = "../reef-logging" }
wgpui = "0.4.0"
unicode-segmentation = "1"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tracing = "0.1"
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
zip = { version = "8", default-features = false, features = ["deflate"] }
ipnet = "2"
chrono = { version = "0.4", features = ["serde"] }

[[bin]]
name = "reef"
path = "src/main.rs"
