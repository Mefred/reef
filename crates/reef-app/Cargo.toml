[package]
name = "reef-app"
description = "Reef network device management desktop application"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"

[dependencies]
reef-engine = { path = "../reef-engine" }
reef-session = { path = "../reef-session" }
reef-storage = { path = "../reef-storage" }
reef-logging = { path = "../reef-logging" }
tauri = { version = "2" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tracing = "0.1"

[build-dependencies]
tauri-build = { version = "2" }

[[bin]]
name = "reef"
path = "src/main.rs"
