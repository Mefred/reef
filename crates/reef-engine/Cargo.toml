[package]
name = "reef-engine"
description = "Pure configuration engine for Cisco IOS XE: models, parsing, planning, generation, verification"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"

[dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "1"
ipnet = { version = "2.8", features = ["serde"] }
regex = "1"

[dev-dependencies]
pretty_assertions = "1"
