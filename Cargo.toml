[workspace]
resolver = "2"
members = [
    "crates/reef-engine",
    "crates/reef-session",
    "crates/reef-storage",
    "crates/reef-logging",
    "crates/reef-app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"

[profile.release]
opt-level = 3
lto = false
panic = "abort"

[profile.dev]
opt-level = 1
